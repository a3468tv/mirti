events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    root /app/live;
    add_header Access-Control-Allow-Origin *;
    location / {
      try_files $uri $uri/ /index.html;
    }
    location ~ \.m3u8$ {
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
    location ~ \.ts$ {
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
  }
}
